name: TruffleHog

on:
  schedule:
    - cron: "21 19 * * 0"  # Every Monday at 04:21 JST (19:21 UTC Sun)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Secret Sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: trufflesecurity/trufflehog@c85580b712841eda4c53bc28fc6ace6100e8c16c  # v3.99.4
        with:
          base: ""
          head: main
          # Keep in step with the action version above; Dependabot does not update this input.
          version: 3.99.4@sha256:bf9238f5bdf26ac28230d4b0bae5162a752b151bf10bea612dad7a62da938731
          extra_args: --results=verified,unknown
